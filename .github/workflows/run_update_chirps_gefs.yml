name: Download recent CHIRPS-GEFS

on:
  schedule:
    - cron: '50 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  run-script:
    runs-on: ubuntu-latest
    # Downloading a new issue date means 16 sequential lead-time files
    # (rate-limited fetch + raster reprojection + blob upload each), which
    # reliably takes just over 10 minutes and was getting cancelled by the
    # job timeout every day.
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-variant: Miniforge3
        use-mamba: true
        activate-environment: mmr-aa-cyclone
        environment-file: environment.yml

    - name: Run script
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
      run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          conda run --no-capture-output -n mmr-aa-cyclone python -u -m src.monitoring.update_chirps_gefs $DATE_ARG
