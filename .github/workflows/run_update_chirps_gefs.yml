name: Download recent CHIRPS-GEFS

on:
  schedule:
    - cron: '50 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      max_issue_dates:
        description: 'Max issue dates to download, newest first (0 = no limit, for backfills).'
        required: false
        default: '3'

jobs:
  run-script:
    runs-on: ubuntu-latest
    # Each issue date is 16 sequential lead-time files (rate-limited fetch +
    # clip + blob upload, about 7 minutes). Scheduled runs download at most 3
    # dates; the ceiling leaves room for backfills with a higher limit.
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-variant: Miniforge3
        use-mamba: true
        activate-environment: mmr-aa-cyclone
        environment-file: environment.yml

    - name: Run script
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
      run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          conda run --no-capture-output -n mmr-aa-cyclone python -u -m src.monitoring.update_chirps_gefs $DATE_ARG --max-issue-dates ${{ inputs.max_issue_dates || 3 }}
